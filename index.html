<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0c0e16"><title>Quiz di Economia — iPad</title><style>/* original dark responsive styling, self-contained */
:root{--bg:#0c0e16;--surface:#171a27;--surface2:#1f2436;--surface3:#272d44;--accent:#5b95f9;--accent2:#7c5cff;--green:#26d07c;--red:#ff5f6d;--amber:#ffb454;--text:#eef1f8;--muted:#98a1bd;--border:#2a3046;--border2:#363d58;--radius:18px}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.5;overflow-x:hidden}body{padding-bottom:92px;background:radial-gradient(1100px 520px at 80% -8%,rgba(124,92,255,.16),transparent 60%),radial-gradient(900px 500px at -10% 0%,rgba(91,149,249,.16),transparent 55%),var(--bg);min-height:100vh}.wrap{max-width:880px;margin:0 auto;padding:22px 16px}h1{font-size:28px;margin:0;font-weight:800}h2{font-size:21px;margin:0 0 16px}.muted{color:var(--muted)}.small{font-size:14px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.spread{justify-content:space-between}.fadein{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:13px 20px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:16px;font-weight:700;cursor:pointer;width:100%;box-shadow:0 8px 20px rgba(91,149,249,.28)}.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border2);box-shadow:none}.btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--muted);box-shadow:none}.backbtn{background:none;border:0;color:var(--accent);font-size:15px;padding:6px 0}.badge,.pill{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:9px;background:var(--surface2);color:var(--muted);border:1px solid var(--border)}.pill.good{color:var(--green)}.pill.mid{color:var(--amber)}.pill.bad{color:var(--red)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}.topic-card,.card,.stat{background:rgba(23,26,39,.9);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.22)}.topic-card{cursor:pointer}.topic-card .name{font-weight:700;margin-bottom:13px;line-height:1.35}.bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;height:76px;background:rgba(12,14,22,.94);backdrop-filter:blur(14px);border-top:1px solid var(--border);display:flex;justify-content:center;gap:18px;padding-bottom:env(safe-area-inset-bottom)}.bottom button{background:none;border:0;color:var(--muted);font-size:12px;padding:8px 18px;min-width:90px}.bottom button.active{color:var(--text)}.ico{display:block;font-size:21px}.progressbar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:14px}.progressbar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}.qtext{font-size:19px;font-weight:600;margin-bottom:18px;white-space:pre-wrap;line-height:1.45}.opt{width:100%;display:flex;align-items:flex-start;text-align:left;gap:12px;padding:15px;margin:8px 0;border-radius:14px;background:var(--surface2);border:1px solid var(--border2);color:var(--text);font-size:16px}.opt .lab{min-width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--surface3);font-weight:800}.opt.correct{border-color:var(--green);background:rgba(38,208,124,.12)}.opt.correct .lab{background:var(--green);color:#07150e}.opt.wrong{border-color:var(--red);background:rgba(255,95,109,.12)}.opt.wrong .lab{background:var(--red);color:#21070a}.feedback{margin:13px 0;padding:12px;border-radius:12px;font-weight:700}.feedback.ok{background:rgba(38,208,124,.1);color:var(--green)}.feedback.no{background:rgba(255,95,109,.1);color:var(--red)}.hidden{display:none!important}.center{text-align:center}.donut{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;margin:6px auto 14px}.donut .inner{width:90px;height:90px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:26px;font-weight:800}.stat{flex:1;min-width:130px}.stat .big{font-size:32px;font-weight:800}.reveal{color:var(--accent);cursor:pointer}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 7px;border-bottom:1px solid var(--border)}select{background:var(--surface2);color:var(--text);border:1px solid var(--border2);border-radius:10px;padding:9px 11px;font-size:14px;max-width:100%}.chartbox{height:240px}.chartbox svg{width:100%;height:100%;display:block}.notice{background:rgba(91,149,249,.08);border:1px solid rgba(91,149,249,.2);border-radius:14px;padding:13px;color:var(--muted);font-size:14px;margin-top:14px}
</style></head><body><div id="app" class="wrap"></div><nav class="bottom"><button data-nav="home"><span class="ico">🏠</span>Home</button><button data-nav="progress"><span class="ico">📈</span>Progressi</button><button data-nav="wrong"><span class="ico">🎯</span>Errori</button></nav><script>const QUESTIONS=[{"id":1,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"Quale delle seguenti affermazioni non esprime compiutamente il principio di economicità? Per operare nel tempo senza necessità di interventi di sostegno, un'azienda deve:","options":{"A":"creare reddito netto positivo","B":"avere ricavi superiori ai costi sostenuti per ottenerli","C":"creare valore per i clienti","D":"creare valore netto positivo"},"correct_answer":"C","type":"mcq"},{"id":2,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"Quale delle seguenti affermazioni è falsa?","options":{"A":"Una funzione è un insieme di attività relativamente omogenee per tipo.","B":"La funzione operations è una funzione di line.","C":"La funzione finanza è una funzione di staff.","D":"La funzione commerciale è una funzione di staff."},"correct_answer":"D","type":"mcq"},{"id":3,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"Quale delle seguenti affermazioni è falsa? (controllo di gestione, R&S, commerciale)","options":{"A":"La funzione controllo di gestione è una funzione di staff.","B":"La funzione ricerca & sviluppo è una funzione di staff.","C":"La funzione commerciale è una funzione di line.","D":"Una funzione è un insieme di attività relativamente omogenee per tipo."},"correct_answer":"B","type":"mcq"},{"id":4,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"Quale delle seguenti affermazioni è falsa? (amministrazione, direzione, R&S)","options":{"A":"La funzione amministrazione è una funzione di staff.","B":"La funzione di direzione aziendale è una funzione di staff.","C":"Una funzione è un insieme di attività relativamente omogenee per tipo.","D":"La funzione ricerca & sviluppo è una funzione di line."},"correct_answer":"B","type":"mcq"},{"id":5,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"Quale fra le seguenti (sotto)funzioni non è di line?","options":{"A":"produzione","B":"logistica","C":"vendite","D":"amministrazione"},"correct_answer":"D","type":"mcq"},{"id":6,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"Quale fra le seguenti (sotto)funzioni non è di staff?","options":{"A":"finanza","B":"sistemi informativi","C":"marketing","D":"controllo di gestione"},"correct_answer":"C","type":"mcq"},{"id":7,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"La capacità di un'azienda di raggiungere gli obiettivi prefissati è espressa dal concetto di:","options":{"A":"efficienza","B":"efficacia","C":"nessuna delle due","D":"entrambe"},"correct_answer":"B","type":"mcq"},{"id":8,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"La percentuale di consegne puntuali è un indicatore diretto di:","options":{"A":"efficienza","B":"flessibilità","C":"efficacia","D":"nessuna delle tre"},"correct_answer":"C","type":"mcq"},{"id":9,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"La percentuale di pezzi scartati è un indicatore inverso di:","options":{"A":"efficienza soltanto","B":"efficacia soltanto","C":"nessuna delle due","D":"entrambe"},"correct_answer":"A","type":"mcq"},{"id":10,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"Quale delle seguenti affermazioni è falsa? Un'azienda è tanto più flessibile quanto minore è il tempo che l'azienda impiega per:","options":{"A":"aumentare il volume di produzione","B":"produrre un prodotto","C":"lanciare un nuovo prodotto","D":"passare dalla produzione di un prodotto a quella di un altro"},"correct_answer":"B","type":"mcq"},{"id":11,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"Il rapporto fra risultati ottenuti e risorse utilizzate definisce:","options":{"A":"l'efficacia di un'organizzazione","B":"l'efficienza di un'organizzazione","C":"la flessibilità di un'organizzazione"},"correct_answer":"B","type":"mcq"},{"id":12,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"Il rapporto fra risultati ottenuti e risultati programmati definisce:","options":{"A":"l'efficacia di un'organizzazione","B":"l'efficienza di un'organizzazione","C":"la flessibilità di un'organizzazione"},"correct_answer":"A","type":"mcq"},{"id":13,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"Se un'azienda nella trentaduesima settimana dell'anno realizza lo stesso output della settimana precedente usando meno input, si dice che l'azienda nella trentaduesima settimana è stata:","options":{"A":"più efficace che nella settimana precedente","B":"più efficiente che nella settimana precedente","C":"più flessibile che nella settimana precedente","D":"meno rigida che nella settimana precedente"},"correct_answer":"B","type":"mcq"},{"id":14,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"Quale dei seguenti non è un concetto caratterizzante la definizione di organizzazione?","options":{"A":"divisione del lavoro fra persone diverse","B":"gerarchia","C":"economicità","D":"coordinamento del lavoro svolto da persone diverse"},"correct_answer":"C","type":"mcq"},{"id":15,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"Quale delle seguenti affermazioni è falsa? (funzioni line e staff)","options":{"A":"Le funzioni di line comprendono le attività che creano valore per il cliente.","B":"Le funzioni di staff comprendono le attività a supporto delle altre funzioni.","C":"Le funzioni di staff offrono supporto solo alle funzioni di line."},"correct_answer":"C","type":"mcq"},{"id":16,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"Quale delle seguenti affermazioni è vera?","options":{"A":"Ogni funzione di staff offre supporto solo alle funzioni di line e alle altre funzioni di staff.","B":"La funzione di direzione aziendale comprende le attività di definizione della strategia aziendale.","C":"Funzioni diverse sono sempre svolte da persone diverse."},"correct_answer":"B","type":"mcq"},{"id":17,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"Il concetto di flessibilità esprime la capacità di un'azienda di:","options":{"A":"raggiungere gli obiettivi prefissati.","B":"massimizzare il risultato raggiunto con le risorse disponibili.","C":"cambiare rapidamente l'output."},"correct_answer":"C","type":"mcq"},{"id":18,"topic_id":1,"topic_name":"FC0 - Concetti introduttivi","question":"Quale dei seguenti non è un indicatore diretto o inverso di efficienza?","options":{"A":"La quantità di materia prima impiegata per realizzare un'unità di prodotto.","B":"Il rapporto fra il reddito netto generato da un'azienda e il capitale investito in azienda dai proprietari.","C":"Il rapporto fra i costi effettivamente sostenuti e i costi che si prevedeva di sostenere."},"correct_answer":"B","type":"mcq"},{"id":19,"topic_id":2,"topic_name":"F1 - Operations: il sistema produttivo","question":"Quale delle seguenti affermazioni è falsa? (nozione di materiale)","options":{"A":"La nozione di materiale include quella di materia prima.","B":"La nozione di materiale include quella di semilavorato.","C":"Tutti i materiali che l'azienda acquista all'esterno sono materie prime.","D":"Un componente d'acquisto del prodotto è una materia prima."},"correct_answer":"D","type":"mcq"},{"id":20,"topic_id":2,"topic_name":"F1 - Operations: il sistema produttivo","question":"Quale delle seguenti affermazioni è falsa? (fabbricazione e assemblaggio)","options":{"A":"Le attività di fabbricazione alterano almeno una caratteristica fisica del materiale.","B":"Le attività di assemblaggio uniscono due o più materiali separati.","C":"Le attività di assemblaggio possono seguire o precedere le attività di fabbricazione.","D":"Un sistema produttivo include sempre sia attività di fabbricazione che attività di assemblaggio."},"correct_answer":"D","type":"mcq"},{"id":21,"topic_id":2,"topic_name":"F1 - Operations: il sistema produttivo","question":"Quale delle seguenti affermazioni è falsa? (classificazione sistemi produttivi)","options":{"A":"I sistemi produttivi sono classificati in base alla natura del loro output.","B":"I sistemi produttivi per processo non fanno in nessun caso attività di assemblaggio.","C":"I sistemi produttivi sono classificati in base all'omogeneità del loro output nel tempo.","D":"I sistemi produttivi a lotti sono caratterizzati da una varietà di prodotti maggiore dei sistemi produttivi a flusso."},"correct_answer":"B","type":"mcq"},{"id":22,"topic_id":2,"topic_name":"F1 - Operations: il sistema produttivo","question":"Quale delle seguenti affermazioni è vera? (varietà e volumi)","options":{"A":"I sistemi produttivi a prodotto singolo sono caratterizzati da assenza di varietà di prodotti.","B":"I sistemi produttivi a flusso sono caratterizzati da una varietà di prodotti inferiore ai sistemi produttivi a lotti.","C":"La differenza fra sistemi produttivi per parti e per processo sta nella presenza o meno di attività di assemblaggio.","D":"I volumi unitari di produzione sono maggiori nei sistemi produttivi a prodotto singolo che nei sistemi a lotti."},"correct_answer":"B","type":"mcq"},{"id":23,"topic_id":2,"topic_name":"F1 - Operations: il sistema produttivo","question":"Quale delle seguenti affermazioni è vera? (layout adatti)","options":{"A":"Un layout per prodotto è adatto a un sistema produttivo a prodotto singolo.","B":"Un layout per processo è adatto a un sistema produttivo a flusso.","C":"Un layout a celle è adatto a un sistema produttivo a lotti."},"correct_answer":"A","type":"mcq"},{"id":24,"topic_id":2,"topic_name":"F1 - Operations: il sistema produttivo","question":"Adottare un lay-out per prodotto significa:","options":{"A":"raggruppare le macchine nello stabilimento in base al tipo di lavorazione che permettono di effettuare.","B":"disporre le macchine nella sequenza prevista dal ciclo di produzione del prodotto.","C":"creare delle divisioni aziendali (business unit) responsabili, ciascuna, di una linea di prodotti diversa.","D":"raggruppare le macchine in celle dedicate, ciascuna, a una famiglia di prodotti diversa."},"correct_answer":"B","type":"mcq"},{"id":25,"topic_id":2,"topic_name":"F1 - Operations: il sistema produttivo","question":"Adottare un lay-out per processo significa:","options":{"A":"raggruppare le macchine nello stabilimento in base al tipo di lavorazione che permettono di effettuare.","B":"disporre le macchine nella sequenza prevista dal ciclo di produzione del prodotto.","C":"creare delle divisioni aziendali (business unit) responsabili, ciascuna, di un processo primario.","D":"raggruppare le macchine in celle dedicate, ciascuna, a una famiglia di prodotti diversa."},"correct_answer":"A","type":"mcq"},{"id":26,"topic_id":2,"topic_name":"F1 - Operations: il sistema produttivo","question":"Quale delle seguenti affermazioni è falsa? (tempo di attraversamento e layout)","options":{"A":"Ceteris paribus, il tempo di attraversamento del sistema produttivo è maggiore in un layout per processo che in uno per prodotto.","B":"Ceteris paribus, passare da un layout per processo a uno a celle permette di ridurre il tempo di attraversamento.","C":"Una cella di produzione raggruppa tutte le macchine necessarie a produrre un insieme di prodotti simili dal punto di vista del ciclo di produzione.","D":"Ceteris paribus, un layout per processo richiede più macchinari di uno per prodotto."},"correct_answer":"D","type":"mcq"},{"id":27,"topic_id":2,"topic_name":"F1 - Operations: il sistema produttivo","question":"Quale delle seguenti affermazioni è vera? (layout adatti, seconda versione)","options":{"A":"Un layout per prodotto è adatto a un sistema produttivo a prodotto singolo.","B":"Un layout per processo è adatto a un sistema produttivo a flusso.","C":"Un layout a celle è adatto a un sistema produttivo a prodotto singolo.","D":"Un layout per prodotto è adatto a un sistema produttivo a flusso."},"correct_answer":"D","type":"mcq"},{"id":28,"topic_id":2,"topic_name":"F1 - Operations: il sistema produttivo","question":"La distinta base è:","options":{"A":"la lista delle operazioni necessarie alla realizzazione di un prodotto.","B":"un documento che mette in luce le caratteristiche distintive di base di un prodotto rispetto agli altri prodotti dell'azienda.","C":"un documento che mette in luce le caratteristiche distintive di base di un prodotto rispetto ai prodotti della concorrenza.","D":"un documento che elenca quali e quante materie prime e quali e quanti semilavorati sono utilizzati nella realizzazione di un'unità di un prodotto in condizioni operative standard."},"correct_answer":"D","type":"mcq"},{"id":29,"topic_id":2,"topic_name":"F1 - Operations: il sistema produttivo","question":"Con riferimento a un generico materiale presente nella distinta base di un certo prodotto finito, quale delle seguenti affermazioni non è sempre vera?","options":{"A":"Il coefficiente d'impiego indica la quantità di materiale necessaria a realizzare un'unità del materiale padre in condizioni operative standard.","B":"Il coefficiente d'impiego indica la quantità di materiale necessaria a realizzare un'unità del prodotto finito in condizioni operative standard.","C":"Il coefficiente d'impiego è minore o eguale all'impiego unitario standard.","D":"L'impiego unitario standard indica la quantità di materiale necessaria a realizzare un'unità di prodotto finito in condizioni operative standard."},"correct_answer":"B","type":"mcq"},{"id":30,"topic_id":2,"topic_name":"F1 - Operations: il sistema produttivo","question":"Il ciclo di produzione di un prodotto è:","options":{"A":"l'elenco delle operazioni necessarie a realizzare il prodotto, senza un ordine preciso.","B":"la sequenza delle operazioni necessarie a realizzare il prodotto.","C":"la lista dei materiali necessari a realizzare il prodotto."},"correct_answer":"B","type":"mcq"},{"id":31,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è falsa? (flusso fisico e informativo)","options":{"A":"In un sistema operativo, flusso fisico e flusso informativo hanno versi opposti.","B":"Il flusso fisico va dai fornitori ai clienti.","C":"Il flusso informativo governa il flusso fisico.","D":"Il flusso informativo è sempre basato sulle richieste effettive dei clienti."},"correct_answer":"D","type":"mcq"},{"id":32,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"La scelta della modalità di risposta al mercato riguarda:","options":{"A":"come posizionare la propria offerta rispetto a quella dei concorrenti.","B":"se utilizzare canali distributivi diretti o indiretti.","C":"quali attività fare su previsione e quali su ordine nella sequenza acquisto-fabbricazione-montaggio-spedizione."},"correct_answer":"C","type":"mcq"},{"id":33,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Un sistema produttivo che acquista i componenti del prodotto sulla base di previsioni di vendita e li assembla una volta che sono stati ricevuti gli ordini dei clienti si definisce di tipo:","options":{"A":"make-to-order","B":"make-to-stock","C":"assemble-to-order","D":"purchase-to-order"},"correct_answer":"C","type":"mcq"},{"id":34,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è vera? Se i clienti sono disposti ad accettare un tempo di consegna pari al tempo necessario a svolgere le attività di assemblaggio e spedizione, allora:","options":{"A":"L'azienda può rispondere al mercato in modalità purchase-to-order.","B":"L'azienda può rispondere al mercato in modalità make-to-order.","C":"L'azienda può rispondere al mercato in modalità make-to-stock."},"correct_answer":"C","type":"mcq"},{"id":35,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è falsa? Se i clienti sono disposti ad accettare un tempo di consegna pari al tempo necessario a svolgere le attività di assemblaggio e spedizione, allora:","options":{"A":"L'azienda può rispondere al mercato in modalità make-to-stock.","B":"L'azienda può rispondere al mercato in modalità assemble-to-order.","C":"L'azienda può rispondere al mercato in modalità make-to-order."},"correct_answer":"C","type":"mcq"},{"id":36,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è falsa? Se i clienti sono disposti ad accettare un tempo di consegna pari al tempo necessario a svolgere le attività di fabbricazione, assemblaggio e spedizione, allora:","options":{"A":"L'azienda può rispondere al mercato in modalità make-to-order.","B":"L'azienda può rispondere al mercato in modalità purchase-to-order.","C":"L'azienda può rispondere al mercato in modalità make-to-stock."},"correct_answer":"B","type":"mcq"},{"id":37,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti iniziative aumenta il grado di integrazione verticale?","options":{"A":"Diminuire la divisione verticale del lavoro all'interno dell'azienda.","B":"Fare in proprio un'attività produttiva che in precedenza era svolta da terzi.","C":"Migliorare lo scambio informativo e la collaborazione tra le funzioni aziendali."},"correct_answer":"B","type":"mcq"},{"id":38,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti iniziative aumenta il grado di integrazione verticale a monte?","options":{"A":"Iniziare a produrre in proprio un componente che in precedenza veniva acquistato.","B":"Passare da una strategia distributiva indiretta a una di distribuzione diretta.","C":"Far fare la manutenzione dei propri macchinari a una ditta esterna."},"correct_answer":"A","type":"mcq"},{"id":39,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti iniziative aumenta il grado di integrazione verticale a valle?","options":{"A":"Iniziare a produrre in proprio un componente che in precedenza veniva acquistato.","B":"Distribuire in proprio i prodotti per i quali in precedenza si usava un fornitore di servizi logistici.","C":"Far fare la manutenzione dei propri macchinari a una ditta esterna."},"correct_answer":"B","type":"mcq"},{"id":40,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è falsa? (politiche di manutenzione, prima)","options":{"A":"La manutenzione ciclica permette di minimizzare i costi per ricambi.","B":"La manutenzione degli impianti può avvenire secondo una politica di manutenzione correttiva.","C":"La manutenzione degli impianti può avvenire secondo una politica di manutenzione preventiva."},"correct_answer":"A","type":"mcq"},{"id":41,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è falsa? (politiche di manutenzione, seconda)","options":{"A":"La manutenzione a guasto permette di minimizzare i costi per ricambi.","B":"La manutenzione correttiva ha il solo obiettivo di minimizzare i costi di mancata produzione.","C":"La manutenzione degli impianti può avvenire secondo una politica di manutenzione su sintomo."},"correct_answer":"B","type":"mcq"},{"id":42,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è falsa? (attività e sottofunzioni operations)","options":{"A":"Il controllo dei materiali in ingresso rientra fra le attività di assicurazione della qualità.","B":"La definizione dei piani di produzione rientra fra le attività della logistica.","C":"La selezione dei fornitori rientra fra le attività di programmazione della produzione.","D":"La gestione delle scorte di semilavorati rientra fra le attività della logistica."},"correct_answer":"C","type":"mcq"},{"id":43,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Le attività di assicurazione della qualità:","options":{"A":"si limitano sempre e solo al controllo dei prodotti finiti.","B":"si limitano sempre e solo al controllo dei prodotti finiti e dei materiali in ingresso.","C":"possono riguardare prodotti finiti, materiali in ingresso e semilavorati."},"correct_answer":"C","type":"mcq"},{"id":44,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è falsa? (scorte di materie prime, prima)","options":{"A":"Le scorte di materie prime aiutano ad assicurare la regolare alimentazione dei reparti produttivi.","B":"Le scorte di materie prime permettono di fronteggiare l'incertezza sulle prestazioni dei fornitori.","C":"Le scorte di materie prime permettono di svincolare i ritmi di produzione di due reparti diversi."},"correct_answer":"C","type":"mcq"},{"id":45,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Le scorte di materie prime servono a:","options":{"A":"far fronte a ritardi nell'avanzamento dei lavori.","B":"svincolare i ritmi di produzione di due reparti diversi.","C":"far fronte a ritardi nelle consegne da parte dei fornitori."},"correct_answer":"C","type":"mcq"},{"id":46,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è falsa? (scorte di sicurezza)","options":{"A":"Le scorte di sicurezza servono a sfruttare la possibilità di ottenere sconti quantità.","B":"Le scorte di sicurezza servono a fronteggiare ordini dei clienti superiori alle previsioni.","C":"Le scorte di sicurezza servono a fronteggiare i ritardi di consegna da parte dei fornitori."},"correct_answer":"A","type":"mcq"},{"id":47,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è falsa? (scorte di ciclo e anticipatorie)","options":{"A":"Le scorte di ciclo disaccoppiano nello spazio le attività di produzione e quelle di vendita.","B":"Le scorte di ciclo disaccoppiano nel tempo le attività di produzione e quelle di vendita per effetto di lotti minimi di produzione e/o spedizione.","C":"Le scorte anticipatorie disaccoppiano nel tempo le attività di produzione e quelle di vendita nel caso di stagionalità della domanda."},"correct_answer":"A","type":"mcq"},{"id":48,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è falsa? (scorte di transito, sicurezza, anticipatorie)","options":{"A":"Le scorte di transito servono a disaccoppiare il punto in cui si vende un prodotto dal punto in cui lo si produce.","B":"Le scorte di sicurezza servono a fronteggiare l'incertezza sulle prestazioni del sistema produttivo.","C":"Le scorte anticipatorie disaccoppiano nello spazio le attività di produzione e quelle di vendita."},"correct_answer":"C","type":"mcq"},{"id":49,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è falsa? La programmazione della produzione è un'attività tipica della (sotto)funzione:","options":{"A":"logistica","B":"operations","C":"controllo di gestione"},"correct_answer":"C","type":"mcq"},{"id":50,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Le attività della programmazione della produzione includono:","options":{"A":"monitorare l'efficienza dei reparti.","B":"bilanciare una linea di montaggio.","C":"definire che cosa, quanto e quando produrre in funzione delle esigenze commerciali.","D":"programmare il livello di qualità dei prodotti."},"correct_answer":"C","type":"mcq"},{"id":51,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"La gestione dei magazzini di prodotti finiti è un'attività tipica della (sotto)funzione:","options":{"A":"marketing","B":"logistica","C":"produzione","D":"vendite"},"correct_answer":"B","type":"mcq"},{"id":52,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"La gestione dei trasporti è un'attività tipica della (sotto)funzione:","options":{"A":"marketing","B":"vendite","C":"logistica","D":"amministrazione"},"correct_answer":"C","type":"mcq"},{"id":53,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"La ricerca e selezione dei fornitori è un'attività tipica della (sotto)funzione:","options":{"A":"marketing","B":"produzione","C":"acquisti","D":"amministrazione"},"correct_answer":"C","type":"mcq"},{"id":54,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è falsa? (negoziazione, controllo, trasporto interno, ordini)","options":{"A":"La negoziazione delle condizioni di fornitura rientra fra le attività di programmazione della produzione.","B":"Il controllo dei prodotti finiti rientra fra le attività di assicurazione della qualità.","C":"La scelta dei sistemi di trasporto interno rientra fra le attività della logistica manifatturiera.","D":"L'emissione degli ordini di fornitura rientra fra le attività della logistica in entrata."},"correct_answer":"A","type":"mcq"},{"id":55,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è falsa? (trasporto interno rigido e layout)","options":{"A":"Un sistema di trasporto interno rigido è adatto a un layout per prodotto.","B":"Un sistema di trasporto interno rigido è adatto a un layout per processo.","C":"Un sistema di trasporto interno rigido è adatto a un layout a celle."},"correct_answer":"B","type":"mcq"},{"id":56,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è vera? (logica tradizionale selezione fornitori)","options":{"A":"La logica tradizionale nella selezione dei fornitori punta a minimizzare i costi di acquisto.","B":"La logica tradizionale nella selezione dei fornitori porta a relazioni stabili con i fornitori.","C":"La logica tradizionale nella selezione dei fornitori porta ad avere pochi fornitori per ciascun materiale di acquisto."},"correct_answer":"A","type":"mcq"},{"id":57,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è falsa? (logistica in entrata)","options":{"A":"La logistica in entrata si occupa della selezione e valutazione dei fornitori.","B":"La logistica in entrata si occupa della definizione del piano degli acquisti e dell'emissione degli ordini di fornitura.","C":"La logistica in entrata si occupa dell'acquisto delle materie prime soltanto."},"correct_answer":"C","type":"mcq"},{"id":58,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è falsa? (piano di produzione)","options":{"A":"Un piano di produzione è un documento che definisce degli obiettivi di produzione per il futuro.","B":"Un piano di produzione definisce obiettivi di produzione tempificati.","C":"Un piano di produzione si basa sempre e solo su previsioni circa le richieste del mercato."},"correct_answer":"C","type":"mcq"},{"id":59,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è falsa? (modalità di risposta al mercato)","options":{"A":"Una modalità di risposta al mercato make-to-stock è adatta a un sistema produttivo a prodotto singolo.","B":"La scelta della modalità di risposta al mercato dipende dalla varietà di prodotti offerta.","C":"La scelta della modalità di risposta al mercato è vincolata dal rapporto fra il tempo richiesto dalle attività di approvvigionamento, produzione e distribuzione e il tempo di consegna richiesto dai clienti."},"correct_answer":"A","type":"mcq"},{"id":60,"topic_id":3,"topic_name":"F1 - Operations: dal sistema produttivo al sistema operativo","question":"Quale delle seguenti affermazioni è falsa? (servomezzi e impianti di servizio)","options":{"A":"I servomezzi sono gli impianti di servizio alla produzione.","B":"Gli impianti di servizio non svolgono attività di trasformazione.","C":"Gli impianti di movimentazione interna dei materiali sono impianti di servizio.","D":"La manutenzione deve assicurare il funzionamento degli impianti produttivi soltanto."},"correct_answer":"D","type":"mcq"},{"id":61,"topic_id":4,"topic_name":"F2 - La funzione di direzione aziendale","question":"Quale delle seguenti affermazioni è falsa? (elasticità della domanda rispetto al prezzo)","options":{"A":"L'elasticità della domanda rispetto al prezzo misura la sensibilità della domanda di un bene a variazioni del prezzo del bene stesso.","B":"Se il prezzo di un bene a domanda anelastica aumenta del 10%, la domanda del bene varia di meno del 10%.","C":"L'elasticità della domanda rispetto al prezzo è definita come il rapporto fra la variazione percentuale del prezzo e la variazione percentuale della domanda."},"correct_answer":"B","type":"mcq"},{"id":62,"topic_id":4,"topic_name":"F2 - La funzione di direzione aziendale","question":"Con riferimento a un bene fornito da un monopolista, quale delle seguenti affermazioni è falsa?","options":{"A":"Se la domanda è elastica, un incremento del prezzo del bene porta a una riduzione dei ricavi della vendita del bene.","B":"Se la domanda è elastica, un decremento del prezzo del bene porta a un incremento dei ricavi della vendita del bene.","C":"Se la domanda è anelastica, i ricavi della vendita del bene variano in senso opposto al prezzo del bene."},"correct_answer":"C","type":"mcq"},{"id":63,"topic_id":4,"topic_name":"F2 - La funzione di direzione aziendale","question":"Quale delle seguenti affermazioni è falsa? (elasticità incrociata, prima)","options":{"A":"L'elasticità incrociata della domanda rispetto al prezzo esprime, in valore assoluto, la variazione percentuale della domanda del bene A per effetto di una certa variazione percentuale del prezzo del bene B.","B":"Prodotti che appartengono alla stessa area strategica d'affari sono caratterizzati da valori dell'elasticità incrociata della domanda rispetto al prezzo nulli o bassi.","C":"Prodotti che appartengono ad aree strategiche d'affari diverse sono caratterizzati da valori dell'elasticità incrociata della domanda rispetto al prezzo nulli o bassi."},"correct_answer":"B","type":"mcq"},{"id":64,"topic_id":4,"topic_name":"F2 - La funzione di direzione aziendale","question":"Quale delle seguenti affermazioni è falsa? (elasticità incrociata, seconda)","options":{"A":"L'elasticità incrociata della domanda rispetto al prezzo esprime, in valore assoluto, la variazione percentuale della domanda del bene A per effetto di una certa variazione percentuale del prezzo del medesimo bene A.","B":"Prodotti che appartengono ad aree strategiche d'affari diverse sono caratterizzati da valori dell'elasticità incrociata della domanda rispetto al prezzo nulli o bassi.","C":"Prodotti che appartengono alla stessa area strategica d'affari sono caratterizzati da valori elevati dell'elasticità incrociata della domanda rispetto al prezzo."},"correct_answer":"A","type":"mcq"},{"id":65,"topic_id":4,"topic_name":"F2 - La funzione di direzione aziendale","question":"Quale delle seguenti affermazioni è falsa? (gamma e linea di prodotti)","options":{"A":"Il numero di prodotti finiti che compongono una certa linea di prodotti prende il nome di profondità della linea.","B":"Il numero di prodotti che compongono la gamma di prodotti di un'azienda prende il nome di ampiezza della gamma.","C":"Il numero di prodotti che compongono la gamma di prodotti di un'azienda prende il nome di estensione della gamma.","D":"A parità di estensione della gamma, al crescere dell'ampiezza della gamma diminuisce la profondità media delle linee di prodotto."},"correct_answer":"C","type":"mcq"},{"id":66,"topic_id":4,"topic_name":"F2 - La funzione di direzione aziendale","question":"Quale delle seguenti affermazioni è falsa? (redditività e attrattività ASA)","options":{"A":"La redditività del capitale investito in una certa area strategica d'affari è un indicatore di efficacia.","B":"Ceteris paribus, l'attrattività di una certa area strategica d'affari cresce al crescere della redditività del capitale investito in quell'area.","C":"Ceteris paribus, l'attrattività di una certa area strategica d'affari cresce al crescere della stabilità della redditività del capitale investito in quell'area."},"correct_answer":"A","type":"mcq"},{"id":67,"topic_id":4,"topic_name":"F2 - La funzione di direzione aziendale","question":"Quale delle seguenti affermazioni è falsa? (potere contrattuale clienti e attrattività)","options":{"A":"Il potere contrattuale dei clienti e il potere contrattuale dei fornitori sono alcuni dei fattori che influenzano l'attrattività di una certa area strategica d'affari.","B":"Una certa area strategica d'affari è tanto più attrattiva quanto più alto è il potere contrattuale dei clienti in quell'area.","C":"L'attrattività di una certa area strategica d'affari dipende dalla minaccia di prodotti sostitutivi."},"correct_answer":"B","type":"mcq"},{"id":68,"topic_id":4,"topic_name":"F2 - La funzione di direzione aziendale","question":"Quale delle seguenti affermazioni è falsa? (modello concorrenza allargata)","options":{"A":"Il modello della concorrenza allargata è utilizzato per valutare l'attrattività di una certa area strategica d'affari.","B":"Il potere contrattuale dei clienti e il potere contrattuale dei fornitori sono i soli fattori che influenzano l'attrattività di una certa area strategica d'affari.","C":"Una certa area strategica d'affari è tanto più attrattiva quanto più bassa è l'intensità della concorrenza fra le imprese che operano in quell'area."},"correct_answer":"B","type":"mcq"},{"id":69,"topic_id":4,"topic_name":"F2 - La funzione di direzione aziendale","question":"Quale delle seguenti affermazioni è falsa? (barriere all'entrata e potere fornitori)","options":{"A":"L'attrattività di una certa area strategica d'affari dipende dal livello delle barriere all'entrata di nuove imprese nell'area.","B":"Una certa area strategica d'affari è tanto più attrattiva quanto più alto è il potere contrattuale dei fornitori in quell'area.","C":"Il modello della concorrenza allargata è chiamato anche modello delle 5 forze."},"correct_answer":"B","type":"mcq"},{"id":70,"topic_id":4,"topic_name":"F2 - La funzione di direzione aziendale","question":"Quale delle seguenti affermazioni è falsa? (matrice tasso di sviluppo - quota di mercato)","options":{"A":"La matrice tasso di sviluppo della domanda - quota di mercato è utilizzata per analizzare il bilanciamento del portafoglio di prodotti di un'azienda.","B":"La matrice assume che al crescere del tasso di sviluppo della domanda di una certa linea di prodotti aumentino i fabbisogni finanziari della linea stessa.","C":"La matrice tasso di sviluppo della domanda - quota di mercato è utilizzata per valutare l'attrattività di una certa area strategica d'affari.","D":"La matrice assume che al crescere della quota di mercato di una certa linea di prodotti crescano le risorse finanziarie generate dalla linea stessa."},"correct_answer":"C","type":"mcq"},{"id":71,"topic_id":4,"topic_name":"F2 - La funzione di direzione aziendale","question":"Quale delle seguenti affermazioni è falsa? (strategia competitiva)","options":{"A":"La strategia competitiva definisce come ottenere un vantaggio competitivo duraturo rispetto ai concorrenti.","B":"Per vantaggio competitivo duraturo s'intende una redditività stabilmente superiore alla media dei concorrenti nel lungo periodo.","C":"La strategia competitiva è sempre definita a livello di intera azienda."},"correct_answer":"C","type":"mcq"},{"id":72,"topic_id":4,"topic_name":"F2 - La funzione di direzione aziendale","question":"Quale delle seguenti affermazioni è falsa? (strategie di base e differenziazione)","options":{"A":"Le strategie funzionali dovrebbero essere coerenti con la strategia competitiva.","B":"La focalizzazione è una delle tre strategie competitive di base.","C":"Una strategia di differenziazione punta a creare un vantaggio competitivo duraturo attraverso costi più bassi dei concorrenti."},"correct_answer":"C","type":"mcq"},{"id":73,"topic_id":4,"topic_name":"F2 - La funzione di direzione aziendale","question":"Quale delle seguenti affermazioni è falsa? (differenziazione e focalizzazione)","options":{"A":"Una strategia di differenziazione punta a creare un vantaggio competitivo duraturo offrendo qualcosa che sia percepito dai potenziali clienti come unico rispetto a quanto offerto dai concorrenti.","B":"La leadership di costo è una delle tre strategie competitive di base.","C":"In una strategia di focalizzazione, la fonte del vantaggio competitivo non può mai essere un livello dei costi inferiore ai concorrenti."},"correct_answer":"C","type":"mcq"},{"id":74,"topic_id":4,"topic_name":"F2 - La funzione di direzione aziendale","question":"Quale delle seguenti affermazioni è vera? (concorrenza monopolistica)","options":{"A":"Quando aziende concorrenti attuano strategie di differenziazione, si parla di concorrenza monopolistica.","B":"Una strategia di differenziazione porta a una competizione sul prezzo.","C":"Un'azienda che attua una strategia di differenziazione è price taker."},"cor ","type":"mcq"},{"id":221,"topic_id":10,"topic_name":"F6 - Progettazione organizzativa: struttura organizzativa","question":"Quale delle seguenti affermazioni è falsa? (criteri di divisione orizzontale)","options":{"A":"Il criterio di divisione orizzontale del lavoro deve essere lo stesso a tutti i livelli gerarchici.","B":"L'area geografica in cui si lavora è un possibile criterio di divisione orizzontale del lavoro.","C":"I criteri di divisione orizzontale del lavoro sono detti anche criteri di raggruppamento."},"correct_answer":"A","type":"mcq"},{"id":222,"topic_id":10,"topic_name":"F6 - Progettazione organizzativa: struttura organizzativa","question":"Quale delle seguenti affermazioni è vera? (arricchimento e allargamento della mansione)","options":{"A":"Arricchire una mansione caratterizzata da un certo livello (possibilmente nullo) di autonomia significa includervi un ulteriore compito caratterizzato dallo stesso livello di autonomia.","B":"Allargare una mansione caratterizzata da un certo livello (possibilmente nullo) di autonomia significa includervi un ulteriore compito caratterizzato da un livello superiore di autonomia.","C":"Arricchire o allargare una mansione è una decisione di micro-struttura organizzativa."},"correct_answer":"B","type":"mcq"},{"id":223,"topic_id":10,"topic_name":"F6 - Progettazione organizzativa: struttura organizzativa","question":"Quale delle seguenti affermazioni è falsa? (macro e micro struttura)","options":{"A":"L'introduzione della figura del direttore operations come capo gerarchico dei direttori produzione e logistica è una decisione di micro-struttura organizzativa.","B":"In un'azienda con struttura organizzativa per prodotto pura, centralizzare le funzioni di staff è una decisione di macro-struttura organizzativa.","C":"In un'azienda con struttura organizzativa per prodotto pura, centralizzare le funzioni di staff produce una struttura organizzativa ibrida."},"correct_answer":"A","type":"mcq"},{"id":224,"topic_id":10,"topic_name":"F6 - Progettazione organizzativa: struttura organizzativa","question":"Quale delle seguenti affermazioni è falsa? (struttura a matrice)","options":{"A":"Una struttura organizzativa a matrice è un esempio di struttura organizzativa ibrida.","B":"Una struttura organizzativa a matrice crea una gerarchia duale.","C":"In una struttura organizzativa a matrice tutti i membri dell'organizzazione hanno due capi, uno gerarchico e uno funzionale, che si trovano allo stesso livello gerarchico."},"correct_answer":"C","type":"mcq"},{"id":225,"topic_id":10,"topic_name":"F6 - Progettazione organizzativa: struttura organizzativa","question":"Quale delle seguenti affermazioni è falsa? (struttura funzionale e autorità)","options":{"A":"La struttura organizzativa è il risultato delle decisioni, formalizzate in documenti, sulla divisione del lavoro all'interno dell'organizzazione.","B":"In un'azienda diversificata, la struttura organizzativa funzionale favorisce l'efficienza evitando la duplicazione di ruoli manageriali.","C":"In una struttura organizzativa funzionale i capi sono dotati solo di autorità funzionale."},"correct_answer":"C","type":"mcq"},{"id":226,"topic_id":10,"topic_name":"F6 - Progettazione organizzativa: struttura organizzativa","question":"Quale delle seguenti affermazioni è falsa? (micro-struttura e struttura per prodotto)","options":{"A":"Le decisioni di micro-struttura organizzativa riguardano il raggruppamento di compiti in mansioni/ruoli.","B":"La struttura organizzativa per prodotto favorisce le sinergie, a livello di acquisti, produzione e vendita, fra aree strategiche d'affari diverse.","C":"Il responsabile dell'Ufficio Vendite ha autorità gerarchica sui venditori che vi lavorano."},"correct_answer":"B","type":"mcq"},{"id":227,"topic_id":10,"topic_name":"F6 - Progettazione organizzativa: struttura organizzativa","question":"Quale delle seguenti affermazioni è falsa? (macro-struttura e sinergie)","options":{"A":"Le decisioni di macro-struttura organizzativa riguardano il raggruppamento di mansioni/ruoli in unità organizzative via via più grandi.","B":"In un'azienda diversificata, la struttura organizzativa funzionale favorisce le sinergie, a livello di acquisti, produzione e vendita, fra aree strategiche d'affari diverse.","C":"In un'azienda diversificata, la struttura organizzativa per prodotto favorisce l'efficienza evitando la duplicazione di ruoli manageriali."},"correct_answer":"C","type":"mcq"},{"id":228,"topic_id":10,"topic_name":"F6 - Progettazione organizzativa: struttura organizzativa","question":"Quale delle seguenti affermazioni è falsa? (attenzione del management e organigramma)","options":{"A":"In un'azienda diversificata, una struttura organizzativa funzionale garantisce una maggior attenzione del management alle singole aree strategiche d'affari.","B":"L'organigramma è una rappresentazione grafica semplificata della struttura organizzativa.","C":"La struttura organizzativa per prodotto pura prevede la duplicazione di tutte le funzioni per ogni area strategica d'affari."},"correct_answer":"A","type":"mcq"},{"id":229,"topic_id":10,"topic_name":"F6 - Progettazione organizzativa: struttura organizzativa","question":"La struttura organizzativa definisce:","options":{"A":"lo stile di direzione","B":"i meccanismi di coordinamento tra le funzioni","C":"la divisione del lavoro all'interno dell'organizzazione","D":"la distribuzione del potere all'interno dell'organizzazione"},"correct_answer":"C","type":"mcq"},{"id":230,"topic_id":10,"topic_name":"F6 - Progettazione organizzativa: struttura organizzativa","question":"In un'azienda diversificata, la struttura organizzativa di tipo funzionale ha il vantaggio di:","options":{"A":"evitare la duplicazione di ruoli manageriali.","B":"garantire una maggior attenzione del management alle singole aree strategiche d'affari.","C":"migliorare il coordinamento tra le persone che lavorano per una stessa area strategica d'affari nelle varie funzioni."},"correct_answer":"A", iare il TFR in azienda è un costo contabile a manifestazione finanziaria differita.","C":"Il costo delle materie prime consumate è un costo contabile a manifestazione finanziaria anticipata."},"correct_answer":"C","type":"mcq"},{"id":244,"topic_id":11,"topic_name":"C1 - Concetti di costo","question":"Quale dei seguenti non è un costo opportunità?","options":{"A":"Costo di mancata vendita dovuto a capacità produttiva scarsa.","B":"Costo di mancata vendita dovuto a guasto di un macchinario.","C":"Costo del personale."},"correct_answer":"C","type":"mcq"},{"id":245,"topic_id":11,"topic_name":"C1 - Concetti di costo","question":"Quale delle seguenti affermazioni è vera? (costo contabile, spesa, costo opportunità)","options":{"A":"A un costo contabile corrisponde sempre temporalmente una spesa.","B":"A una spesa corrisponde sempre un costo contabile.","C":"Un costo opportunità è un mancato profitto."},"correct_answer":"C","type":"mcq"},{"id":246,"topic_id":11,"topic_name":"C1 - Concetti di costo","question":"Quale delle seguenti affermazioni è falsa? (spese e costi)","options":{"A":"Le spese sono uscite di denaro.","B":"A un costo corrisponde sempre una spesa.","C":"I costi rappresentano una perdita di valore."},"correct_answer":"B","type":"mcq"},{"id":247,"topic_id":11,"topic_name":"C1 - Concetti di costo","question":"Quale delle seguenti affermazioni è falsa? (costi come fatto finanziario)","options":{"A":"Esistono costi cui non corrispondono delle spese.","B":"Costi contabili e spese sono sfasati nel tempo.","C":"I costi sono un fatto finanziario."},"correct_answer":"C","type":"mcq"},{"id":248,"topic_id":11,"topic_name":"C1 - Concetti di costo","question":"Quale delle seguenti affermazioni è falsa? (costi opportunità)","options":{"A":"I costi opportunità sono chiamati anche costi figurativi.","B":"I costi opportunità sono utili per prendere decisioni.","C":"I costi opportunità sono registrati dalla contabilità aziendale."},"correct_answer":"C","type":"mcq"},{"id":249,"topic_id":11,"topic_name":"C1 - Concetti di costo","question":"Quale delle seguenti affermazioni è vera? (oggetto di costo)","options":{"A":"Un oggetto di costo è sempre un materiale o un prodotto finito.","B":"Un oggetto di costo è sempre qualcosa di tangibile.","C":"Un oggetto di costo è un qualsiasi scopo per cui si impiegano risorse con un valore economico."},"correct_answer":"C","type":"mcq"},{"id":250,"topic_id":11,"topic_name":"C1 - Concetti di costo","question":"Quale delle seguenti affermazioni è falsa? (costi industriali e di trasformazione)","options":{"A":"I costi di logistica distributiva fanno parte dei costi industriali.","B":"I costi di trasformazione fanno parte dei costi industriali.","C":"I costi dei materiali indiretti consumati dalle operations fino ai cancelli della fabbrica fanno parte dei costi di trasformazione."},"correct_answer":"A","type":"mcq"},{"id":251,"topic_id":11,"topic_name":"C1 - Concetti di costo","question":"Quale delle seguenti affermazioni è vera? (manodopera diretta e indiretta)","options":{"A":"Il costo della manodopera diretta è sempre un costo diretto.","B":"Il costo della manodopera indiretta è sempre un costo indiretto, qualsiasi sia l'oggetto di costo considerato.","C":"La manodopera indiretta non è coinvolta nello svolgimento delle attività di trasformazione."},"correct_answer":"C","type":"mcq"},{"id":252,"topic_id":11,"topic_name":"C1 - Concetti di costo","question":"Quale delle seguenti affermazioni NON è necessariamente vera? (costo diretto)","options":{"A":"Se un fattore produttivo è utilizzato in maniera completa ed esclusiva per un oggetto di costo, il costo del fattore produttivo è diretto rispetto a questo oggetto.","B":"Se un fattore produttivo è utilizzato per più oggetti di costo e si misura la quantità effettiva di fattore produttivo utilizzata per ognuno di questi oggetti, il costo del fattore produttivo è diretto rispetto ciascuno di essi.","C":"Se un fattore produttivo è utilizzato interamente per più oggetti di costo e si misura la quantità effettiva di fattore produttivo utilizzata per ognuno di questi oggetti, il costo del fattore produttivo è diretto rispetto ciascuno di essi."},"correct_answer":"C","type":"mcq"},{"id":253,"topic_id":11,"topic_name":"C1 - Concetti di costo","question":"Quale delle seguenti affermazioni è falsa? (costo indiretto)","options":{"A":"Un costo indiretto rispetto a un oggetto di costo può essere attribuito a quell'oggetto di costo solo in maniera arbitraria.","B":"Un costo indiretto riguarda un fattore produttivo impiegato per almeno due oggetti di costo differenti.","C":"Rispetto all'intera impresa, tutti i costi sono indiretti."},"correct_answer":"C","type":"mcq"},{"id":254,"topic_id":11,"topic_name":"C1 - Concetti di costo","question":"Se per un fattore produttivo usato interamente per due o più oggetti di costo è in teoria possibile misurare la quantità effettivamente impiegata per ciascun oggetto di costo, quale delle seguenti affermazioni è sicuramente vera?","options":{"A":"Il costo del fattore produttivo è diretto rispetto agli oggetti di costo in questione.","B":"Il costo del fattore produttivo è indiretto rispetto agli oggetti di costo in questione.","C":"Il costo del fattore produttivo è diretto o indiretto a seconda che si misurino effettivamente o meno i volumi fisici d'impiego."},"correct_answer":"C","type":"mcq"},{"id":255,"topic_id":11,"topic_name":"C1 - Concetti di costo","question":"Se per un fattore produttivo usato per due o più oggetti di costo si misura la quantità effettivamente impiegata per ciascun oggetto di costo, quale delle seguenti affermazioni è sicuramente vera?","options":{"A":"Il costo del fattore produttivo è diretto rispetto agli oggetti di costo in questione.","B":"Il costo del fattore produttivo è indiretto rispetto agli oggetti di costo in questione.","C":"Il costo del fattore produttivo è diretto o indiretto a seconda che il fattore produttivo venga usato in maniera completa o meno per gli ogget omie di scala per lo stesso prodotto. Se A ha capacità produttiva doppia di B, quale delle seguenti affermazioni è falsa?","options":{"A":"Il costo pieno unitario del prodotto realizzato con l'impianto A è sempre inferiore al costo pieno unitario del prodotto realizzato con l'impianto B.","B":"Il costo pieno unitario minimo del prodotto realizzato con l'impianto A è inferiore al costo pieno unitario minimo del prodotto realizzato con l'impianto B.","C":"Il costo fisso dell'impianto A è meno che doppio rispetto a quello dell'impianto B."},"correct_answer":"A","type":"mcq"},{"id":346,"topic_id":15,"topic_name":"C4 - Determinanti dei costi: costi misti, costo unitario di breve periodo, economie di scala","question":"Due impianti A e B usano la stessa tecnologia con economie di scala per lo stesso prodotto. Se A ha capacità produttiva doppia di B, quale delle seguenti affermazioni è vera?","options":{"A":"Il costo pieno unitario del prodotto realizzato con l'impianto A è sempre inferiore al costo pieno unitario del prodotto realizzato con l'impianto B.","B":"Il minimo del costo pieno unitario del prodotto realizzato con l'impianto A è inferiore al minimo del costo pieno unitario del prodotto realizzato con l'impianto B.","C":"Il costo fisso dell'impianto A è doppio rispetto a quello dell'impianto B."},"correct_answer":"B","type":"mcq"},{"id":347,"topic_id":15,"topic_name":"C4 - Determinanti dei costi: costi misti, costo unitario di breve periodo, economie di scala","question":"Quale delle seguenti affermazioni è vera? Una tecnologia produttiva è caratterizzata da economie di scala se:","options":{"A":"il costo pieno unitario del prodotto realizzato con tale tecnologia diminuisce al crescere del volume di produzione nel breve periodo.","B":"il costo pieno unitario del prodotto realizzato con tale tecnologia cresce al crescere del volume di produzione nel breve periodo.","C":"il minimo del costo pieno unitario di breve periodo di un prodotto realizzato con quella tecnologia diminuisce al crescere della capacità produttiva, a parità di prezzi dei fattori produttivi."},"correct_answer":"C","type":"mcq"},{"id":348,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Quale dei seguenti non è un assunto sottostante la formula: volume di pareggio = costi fissi totali / (prezzo - costo variabile unitario)?","options":{"A":"Azienda monoprodotto.","B":"Capacità produttiva non modificabile.","C":"Assenza di qualsiasi tipo di costo misto.","D":"Costi variabili totali direttamente proporzionali al volume di produzione/vendita."},"correct_answer":"C","type":"mcq"},{"id":349,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Quale dei seguenti non è un assunto per l'esistenza del Volume di pareggio = costi fissi totali / (prezzo - costo variabile unitario)?","options":{"A":"Prezzo superiore al costo variabile unitario.","B":"Costi fissi totali minori o eguali alla differenza fra ricavi totali e costi totali calcolata in corrispondenza del pieno utilizzo della capacità produttiva.","C":"Costi fissi totali minori o eguali alla differenza fra ricavi totali e costi variabili totali calcolata in corrispondenza del pieno utilizzo della capacità produttiva."},"correct_answer":"B","type":"mcq"},{"id":350,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Azienda monoprodotto: costi fissi totali mensili 100, costo variabile unitario 8, prezzo unitario 10. Il volume mensile di pareggio vale:","options":{"A":"10","B":"13","C":"50"},"correct_answer":"C","type":"mcq"},{"id":351,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Azienda monoprodotto: costi fissi totali mensili 1.000, costo variabile unitario 6, prezzo unitario 16. Il volume mensile di pareggio vale:","options":{"A":"167","B":"100","C":"63"},"correct_answer":"B","type":"mcq"},{"id":352,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Azienda monoprodotto: costi fissi tota z. Costi: energia FM 10 euro/pz, materie prime 60 euro/pz, manodopera diretta 30 euro/pz, ammortamenti industriali 80 k-euro, forza vendita diretta 30 k-euro, costi amministrativi 10 k-euro. Volume annuo di pareggio considerando la manodopera diretta un costo variabile?","options":{"A":"750","B":"1.200","C":"2.000"},"correct_answer":"C","type":"mcq"},{"id":358,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Quale delle seguenti affermazioni è falsa? (grado di leva operativa, prima)","options":{"A":"Sotto opportuni assunti, il grado di leva operativa vale 1/{1-[CF/(p-cv)]}.","B":"Ceteris paribus, più elevato è il grado di leva operativa, più perdite l'impresa fa sotto il volume di pareggio.","C":"Il grado di leva operativa permette di capire quanto varia percentualmente il risultato economico d'esercizio per effetto di una certa variazione percentuale del volume di vendita."},"correct_answer":"A","type":"mcq"},{"id":359,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Quale delle seguenti affermazioni è falsa? (grado di leva operativa, seconda)","options":{"A":"Il grado di leva operativa permette di capire quanto varia percentualmente il risultato economico d'esercizio per effetto di una certa variazione percentuale del volume di vendita.","B":"Sotto opportuni assunti, il grado di leva operativa vale 1/{1-[CF/(p-cv)V0]}.","C":"Ceteris paribus, più elevato è il grado di leva operativa, meno utili l'impresa fa sopra il volume di pareggio."},"correct_answer":"C","type":"mcq"},{"id":360,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Quale delle seguenti affermazioni è falsa? (grado di leva operativa, terza)","options":{"A":"Il grado di leva operativa dipende dall'incidenza dei costi fissi sui costi totali dell'azienda.","B":"Sotto opportuni assunti, il grado di leva operativa vale 1/[CF/(p-cv)V0].","C":"Ceteris paribus, più elevato è il grado di leva operativa, più utili l'impresa fa sopra il volume di pareggio."},"correct_answer":"B","type":"mcq"},{"id":361,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Quale delle seguenti affermazioni è falsa? (grado di leva operativa, quarta)","options":{"A":"Il grado di leva operativa è il rapporto fra la variazione percentuale del risultato economico d'esercizio e la variazione percentuale del volume di vendita.","B":"Sotto opportuni assunti, il grado di leva operativa vale 1/[1-(CF/V0)].","C":"Ceteris paribus, più elevato è il grado di leva operativa, più perdite l'impresa fa sotto il volume di pareggio."},"correct_answer":"B","type":"mcq"},{"id":362,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Prodotto a 100 euro/pz. Costi: materie prime 25 euro/pz, lavorazioni esterne 15 euro/pz, manodopera diretta 40 k-euro, ammortamenti industriali 85 k-euro, provvigioni 10 euro/pz, costi amministrativi 25 k-euro. Manodopera diretta = costo fisso di capacità. Volume di pareggio (Vp) e grado di leva operativa (GdLO) a un volume pari a 3 volte il volume di pareggio?","options":{"A":"Vp=3.000, GdLO=1,5","B":"Vp=15.000, GdLO=1,5","C":"Vp=3.750, GdLO=3","D":"Vp=3.000, GdLO=3"},"correct_answer":"A","type":"mcq"},{"id":363,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Prodotto a 100 euro/pz. Costi: materie prime 20 euro/pz, lavorazioni esterne 10 euro/pz, manodopera diretta 30 euro/pz, ammortamenti industriali 90 k-euro, provvigioni 10 euro/pz, costi amministrativi 30 k-euro. Manodopera diretta = costo variabile. Volume di pareggio (Vp) e grado di leva operativa (GdLO) a un volume pari a 1,5 volte il volume di pareggio?","options":{"A":"Vp=2.500, GdLO=3","B":"Vp=4.000, GdLO=3","C":"Vp=4.000, GdLO=1,5"},"correct_answer":"B","type":"mcq"},{"id":364,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Quale delle seguenti affermazioni è falsa? (struttura di costo elastica/rigida)","options":{"A":"Con una struttura di costo elastica, il risultato economico di esercizio è più sensibile alle variazioni del volume di vendita.","B":"Con una struttura di costo elastica, il risultato economico di esercizio è meno sensibile alle variazioni del volume di vendita.","C":"Una struttura di costo è tanto più rigida quanto maggiore è l'incidenza dei costi fissi sui costi totali a un volume normale di produzione/vendita."},"correct_answer":"A","type":"mcq"},{"id":365,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Quale delle seguenti affermazioni è falsa? (esternalizzazione e integrazione verticale)","options":{"A":"L'esternalizzazione di attività produttive fa diminuire il grado di leva operativa.","B":"L'integrazione verticale a monte fa diminuire il grado di leva operativa.","C":"Il grado di leva operativa è l'elasticità del risultato economico d'esercizio rispetto al volume di vendita."},"correct_answer":"B","type":"mcq"},{"id":366,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Azienda produce e vende 250 pz/mese a 500 euro/pz. Costi fissi totali 20.000 euro/mese, costo variabile unitario 300 euro/pz. Quale affermazione è falsa?","options":{"A":"Il margine di sicurezza è del 60%.","B":"Il margine di sicurezza è del 150%.","C":"L'azienda può ridurre il suo fatturato del 60% senza andare in perdita."},"correct_answer":"B","type":"mcq"},{"id":367,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Azienda produce e vende 80 pz/mese a 500 euro/pz. Costi fissi totali 20.000 euro/mese, costo variabile unitario 300 euro/pz. Quale affermazione è vera?","options":{"A":"Il margine di sicurezza è del 20%.","B":"Il margine di sicurezza è del 25%.","C":"L'azienda può ridurre il suo fatturato del 25% senza andare in perdita."},"correct_answer":"B","type":"mcq"},{"id":368,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Unico prodotto venduto a 500 euro/pz, costo variabile unitario 300 euro/pz, costi fissi totali 20.000 euro/mese. Quale affermazione non è sicuramente vera?","options":{"A":"Il volume mensile di pareggio ammonta a 100.","B":"L'azienda deve vendere 150 pz/mese se vuole realizzare utili per 10.000 euro/mese.","C":"Il margine di sicurezza è del 50%."},"correct_answer":"C","type":"mcq"},{"id":369,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Quale dei seguenti non è un obiettivo dell'analisi costi-volumi-profitti?","options":{"A":"Determinare l'elasticità del risultato economico d'esercizio rispetto al volume di vendita.","B":"Determinare l'elasticità del risultato economico d'esercizio rispetto al prezzo di vendita.","C":"Capire se esistono economie di scala.","D":"Determinare il punto di pareggio."},"correct_answer":"C","type":"mcq"},{"id":370,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Quale delle seguenti affermazioni è falsa? (formule grado di leva operativa e volume di pareggio)","options":{"A":"Sotto opportuni assunti, il grado di leva operativa vale: MdCs(V0)/RE(V0).","B":"Sotto opportuni assunti, il volume di pareggio vale: costi fissi totali diviso margine di contribuzione semplice percentuale.","C":"Sotto opportuni assunti, il grado di leva operativa vale: 1/{1-[Vp/V0]}."},"correct_answer":"B","type":"mcq"},{"id":371,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Sotto opportuni assunti, quale delle seguenti eguaglianze è falsa in corrispondenza del punto di pareggio di un'impresa monoprodotto?","options":{"A":"ricavi totali = costi totali","B":"margine di contribuzione semplice unitario = costi fissi totali","C":"fatturato di pareggio = costi fissi totali diviso margine di contribuzione semplice percentuale"},"correct_answer":"B","type":"mcq"},{"id":372,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Quale delle seguenti affermazioni è falsa? (formule grado di leva operativa)","options":{"A":"Sotto opportuni assunti, il grado di leva operativa vale: MdCs(V0)/(MdCs(V0) - CF).","B":"Sotto opportuni assunti, il grado di leva operativa vale: 1/{1-[CF/mdcs*V0]}.","C":"Sotto opportuni assunti, il grado di leva operativa vale: MdCs(V0)/(MdCs(V0) + CF)."},"correct_answer":"C","type":"mcq"},{"id":373,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Quale delle seguenti affermazioni è falsa? (margine di contribuzione semplice, prima)","options":{"A":"Se positivo, il margine di contribuzione semplice unitario di un prodotto è il contributo che la vendita di un'unità del prodotto dà alla copertura dei costi fissi totali dell'azienda ed, eventualmente, alla generazione di utili.","B":"Se positivo, il margine di contribuzione semplice complessivo di un prodotto è il contributo che la vendita del prodotto dà alla copertura dei suoi costi variabili.","C":"Se positivo, il margine di contribuzione semplice unitario di un prodotto è l'incremento del risultato economico di esercizio dovuto alla vendita di un'unità in più del prodotto."},"correct_answer":"B","type":"mcq"},{"id":374,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Quale delle seguenti affermazioni è falsa? (margine di contribuzione semplice, seconda)","options":{"A":"Se negativo, il margine di contribuzione semplice unitario di un prodotto è il decremento del risultato economico d'esercizio dovuto alla vendita di un'unità in più del prodotto.","B":"Se positivo, il margine di contribuzione semplice unitario di un prodotto è il contributo che la vendita di un'unità del prodotto dà alla copertura dei suoi costi fissi totali.","C":"Il margine di contribuzione semplice complessivo di un prodotto è direttamente proporzionale al numero di unità del prodotto vendute."},"correct_answer":"B","type":"mcq"},{"id":375,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Quale delle seguenti affermazioni è sicuramente vera? (margine di contribuzione semplice complessivo)","options":{"A":"Se positivo, il margine di contribuzione semplice complessivo di un prodotto è il contributo che la vendita del prodotto dà alla generazione di utili.","B":"Se positivo, il margine di contribuzione semplice complessivo di un prodotto è il contributo che la vendita del prodotto dà alla copertura dei costi fissi totali dell'azienda e, una volta coperti tutti questi costi, alla generazione di utili.","C":"Se positivo, il margine di contribuzione semplice complessivo di un prodotto è il contributo che la vendita del prodotto dà alla copertura dei costi fissi totali dell'azienda e, una volta coperti tutti questi costi e nell'ipotesi di azienda monoprodotto, alla generazione di utili."},"correct_answer":"C","type":"mcq"},{"id":376,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"Quale delle seguenti affermazioni è falsa? (margine di contribuzione semplice percentuale)","options":{"A":"Il margine di contribuzione semplice percentuale di un prodotto è l'incidenza del suo margine di contribuzione semplice complessivo sui ricavi totali della vendita del prodotto.","B":"Il margine di contribuzione semplice percentuale di un prodotto è l'incidenza del suo margine di contribuzione semplice unitario sul prezzo di vendita del prodotto.","C":"Se positivo, il margine di contribuzione semplice percentuale è il contributo che la vendita di un'unità del prodotto dà alla copertura dei costi fissi totali dell'azienda."},"correct_answer":"C","type":"mcq"},{"id":377,"topic_id":16,"topic_name":"C5 - Analisi costi-volumi-profitti","question":"A quale prezzo va venduto un prodotto il cui costo variabile unitario è pari a 300 euro/pz se si vuole che ogni euro di fatturato del prodotto contribuisca a coprire il 25% dei costi fissi totali dell'azienda?","options":{"A":"1200 euro/pz","B":"400 euro/pz","C":"375 euro/pz"},"correct_answer":"B","type":"mcq"},{"id":378,"topic_id":17,"topic_name":"C6 - Decisioni di gestione corrente: make or buy","question":"Quale delle seguenti affermazioni non è sempre vera? (decisioni di gestione corrente e d'investimento)","options":{"A":"Una decisione di gestione corrente è attuabile nel breve periodo.","B":"Una decisione di gestione corrente riguarda l'utilizzo della capacità produttiva scarsa esistente.","C":"Una decisione d'investimento (relativa alla gestione caratteristica di un'impresa industriale) modifica la capacità produttiva."},"correct_answer":"B","type":"mcq"},{"id":379,"topic_id":17,"topic_name":"C6 - Decisioni di gestione corrente: make or buy","question":"Quale delle seguenti affermazioni è falsa? (decisioni di gestione corrente e d'investimento)","options":{"A":"Una decisione di gestione corrente è immediatamente reversibile.","B":"Una decisione d'investimento (relativa alla gestione caratteristica di un'impresa industriale) non è attuabile nel breve periodo.","C":"Una decisione di gestione corrente con capacità produttiva scarsa riguarda solo le piccole imprese."},"correct_answer":"C","type":"mcq"},{"id":380,"topic_id":17,"topic_name":"C6 - Decisioni di gestione corrente: make or buy","question":"Quale delle seguenti affermazioni è falsa? (convenienza economica, alternative)","options":{"A":"In una decisione di convenienza economica, l'alternativa di base consiste nel non fare nulla.","B":"In una decisione di convenienza economica fra alternative a obiettivo identico, i ricavi sono sempre irrilevanti per la decisione.","C":"Una decisione di convenienza economica dipende sempre e solo dai ricavi e costi differenziali.","D":"I costi totali differenziali sono i costi dell'alternativa di cambiamento meno quelli dell'alternativa di base."},"correct_answer":"A","type":"mcq"},{"id":381,"topic_id":17,"topic_name":"C6 - Decisioni di gestione corrente: make or buy","question":"Quale delle seguenti affermazioni è sicuramente vera? (costi totali differenziali)","options":{"A":"Se i costi totali differenziali sono positivi, l'alternativa di base è economicamente più conveniente."," ponente in condizioni di capacità produttiva scarsa, quale delle seguenti affermazioni è falsa?","options":{"A":"I costi variabili del componente sono sempre rilevanti.","B":"I costi fissi diretti discrezionali del componente possono essere rilevanti.","C":"I costi fissi diretti di capacità del componente possono essere rilevanti."},"correct_answer":"C","type":"mcq"},{"id":386,"topic_id":17,"topic_name":"C6 - Decisioni di gestione corrente: make or buy","question":"Quale delle seguenti affermazioni è falsa? (make or buy, obiettivo identico e costi cessanti)","options":{"A":"In una decisione di make or buy con capacità produttiva non modificabile e abbondante, le alternative sono a obiettivo identico.","B":"In una decisione di make or buy con capacità produttiva non modificabile e scarsa, le alternative sono a obiettivo identico.","C":"In una decisione di make or buy con capacità produttiva non modificabile, i costi cessanti sono quelli che l'azienda smette di sostenere se cambia lo status quo."},"correct_answer":"B","type":"mcq"},{"id":387,"topic_id":17,"topic_name":"C6 - Decisioni di gestione corrente: make or buy","question":"Con riferimento alle decisioni di make or buy di breve periodo, quale delle seguenti affermazioni è falsa? (costi cessanti e sorgenti)","options":{"A":"I costi cessanti sono quelli che cessano per effetto della decisione di mutare lo status quo.","B":"I costi sorgenti sono quelli che sorgono per effetto della decisione di mutare lo status quo.","C":"I costi sorgenti sono sempre quelli che sorgono se si decide di acquistare il componente all'esterno."},"correct_answer":"C","type":"mcq"},{"id":388,"topic_id":17,"topic_name":"C6 - Decisioni di gestione corrente: make or buy","question":"Con riferimento alle decisioni di make or buy di breve periodo, quale delle seguenti affermazioni è falsa? (costi totali differenziali e RE)","options":{"A":"I costi totali differenziali sono pari ai costi sorgenti meno i costi cessanti.","B":"Il risultato economico d'esercizio differenziale è pari ai costi sorgenti meno i costi cessanti.","C":"I costi cessanti sono quelli che cessano se si decide di cambiare lo status quo."},"correct_answer":"B","type":"mcq"},{"id":389,"topic_id":17,"topic_name":"C6 - Decisioni di gestione corrente: make or buy","question":"Con riferimento alle decisioni di make or buy in condizioni di capacità produttiva non modificabile, flessibile e scarsa, quale delle seguenti affermazioni non è sempre vera?","options":{"A":"I costi opportunità di mancata vendita sono sempre rilevanti.","B":"I costi opportunità di mancata vendita dipendono dal margine di contribuzione semplice unitario del prodotto di cui si perde la vendita.","C":"I costi opportunità di mancata vendita sono direttamente proporzionali alle unità di prodotto di cui si perde la vendita."},"correct_answer":"A","type":"mcq"},{"id":390,"topic_id":17,"topic_name":"C6 - Decisioni di gestione corrente: make or buy","question":"Con riferimento alle decisioni di make or buy in condizioni di capacità produttiva non modificabile, flessibile e scarsa, quale delle seguenti affermazioni è vera?","options":{"A":"I costi opportunità di mancata vendita sono sempre costi cessanti.","B":"I costi opportunità di mancata vendita sono sempre costi sorgenti.","C":"I costi opportunità di mancata vendita sono costi sorgenti se al momento di prendere la decisione il componente è prodotto all'esterno dell'azienda."},"correct_answer":"C","type":"mcq"},{"id":391,"topic_id":17,"topic_name":"C6 - Decisioni di gestione corrente: make or buy","question":"Con riferimento alla decisione di gestione corrente relativa al make or buy di un componente, quale delle seguenti affermazioni è vera?","options":{"A":"Il costo di acquisto del componente è sicuramente un costo sorgente.","B":"Il costo di acquisto delle materie prime per produrre il componente è sicuramente un costo cessante.","C":"Il costo di acquisto del componente è un costo sorgente se al momento di prendere la decisione il componente è prodotto all'interno dell'azienda."},"correct_answer":"C","type":"mcq"},{"id":392,"topic_id":17,"topic_name":"C6 - Decisioni di gestione corrente: make or buy","question":"Con riferimento a una decisione di gestione corrente, quale delle seguenti affermazioni è vera?","options":{"A":"I costi variabili sono sempre rilevanti.","B":"I costi fissi non sono mai rilevanti.","C":"I costi fissi diretti sono sempre rilevanti.","D":"I costi fissi di capacità non sono mai rilevanti."},"correct_answer":"A","type":"mcq"},{"id":393,"topic_id":17,"topic_name":"C6 - Decisioni di gestione corrente: make or buy","question":"Quale delle seguenti affermazioni è falsa? (costi fissi di capacità e discrezionali)","options":{"A":"I costi fissi di capacità non possono essere eliminati o attivati senza modificare la capacità produttiva.","B":"I costi fissi discrezionali possono essere eliminati o attivati senza modificare la capacità produttiva.","C":"I costi fissi indiretti sono sempre irrilevanti nelle decisioni di gestione corrente.","D":"I costi fissi discrezionali sono sempre rilevanti nelle decisioni di gestione corrente."},"correct_answer":"D","type":"mcq"},{"id":394,"topic_id":17,"topic_name":"C6 - Decisioni di gestione corrente: make or buy","question":"Quale delle seguenti affermazioni è falsa? (costi variabili, fissi di capacità e discrezionali)","options":{"A":"Tutti i costi variabili sono sempre rilevanti nelle decisioni di gestione corrente.","B":"I costi fissi di capacità non sono mai rilevanti per le decisioni di gestione corrente.","C":"I costi fissi discrezionali possono essere rilevanti per le decisioni di gestione corrente."},"correct_answer":"A","type":"mcq"},{"id":395,"topic_id":17,"topic_name":"C6 - Decisioni di gestione corrente: make or buy","question":"Componente costruito in casa: manodopera diretta 20, materie prime 35, ammortamenti industriali diretti rispetto al componente 5, ammortamenti industriali indiretti 10, costi amministrativi 10.
