 e acquistarlo da un fornitore?","options":{"A":"115","B":"105","C":"50","D":"45"},"correct_answer":"C","type":"mcq"},{"id":403,"topic_id":18,"topic_name":"C6 - Decisioni di gestione corrente: decisioni di vendita","question":"Con riferimento a un prodotto venduto, quale delle seguenti affermazioni è falsa? (margine di contribuzione evoluto vs semplice, prima)","options":{"A":"Il margine di contribuzione evoluto è sempre maggiore del margine di contribuzione semplice.","B":"Il margine di contribuzione evoluto è sempre minore o eguale al margine di contribuzione semplice.","C":"Se il margine di contribuzione semplice è positivo, esso esprime il contributo che il prodotto dà alla copertura dei costi fissi totali dell'azienda e, una volta coperti questi costi e nell'ipotesi di azienda monoprodotto, alla generazione di utili."},"correct_answer":"A","type":"mcq"},{"id":404,"topic_id":18,"topic_name":"C6 - Decisioni di gestione corrente: decisioni di vendita","question":"Con riferimento a un prodotto venduto, quale delle seguenti affermazioni è vera? (margine di contribuzione semplice vs evoluto)","options":{"A":"Il margine di contribuzione semplice è sempre maggiore del margine di contribuzione evoluto.","B":"Il margine di contribuzione semplice è sempre maggiore o eguale al margine di contribuzione evoluto.","C":"Un margine di contribuzione evoluto positivo esprime il contributo che il prodotto dà alla copertura di tutti i costi fissi totali dell'azienda e, eventualmente, alla generazione di utili."},"correct_answer":"B","type":"mcq"},{"id":405,"topic_id":18,"topic_name":"C6 - Decisioni di gestione corrente: decisioni di vendita","question":"Con riferimento a un prodotto venduto, quale delle seguenti affermazioni è vera? (margine di contribuzione evoluto)","options":{"A":"Il margine di contribuzione evoluto è sempre maggiore del margine di contribuzione semplice.","B":"Il margine di contribuzione evoluto è sempre minore del margine di contribuzione semplice.","C":"Un margine di contribuzione evoluto positivo esprime il contributo che il prodotto dà alla copertura dei costi fissi totali dell'azienda.","D":"Se il margine di contribuzione evoluto è positivo, esprime il contributo che la vendita del prodotto dà alla copertura dei costi fissi totali dell'azienda non direttamente attribuibili al prodotto."},"correct_answer":"D","type":"mcq"},{"id":406,"topic_id":18,"topic_name":"C6 - Decisioni di gestione corrente: decisioni di vendita","question":"Qual è la definizione di margine di contribuzione complessivo evoluto di un prodotto?","options":{"A":"Ricavi totali di un prodotto meno costi totali del prodotto.","B":"Ricavi totali di un prodotto meno costi variabili totali del prodotto.","C":"Ricavi totali di un prodotto meno costi fissi diretti totali del prodotto.","D":"Ricavi totali di un prodotto meno costi variabili totali e costi fissi diretti totali del prodotto."},"correct_answer":"D","type":"mcq"},{"id":407,"topic_id":18,"topic_name":"C6 - Decisioni di gestione corrente: decisioni di vendita","question":"Quale delle seguenti affermazioni è falsa? (convenienza a produrre e MdC)","options":{"A":"Il margine di contribuzione evoluto non è mai superiore al margine di contribuzione semplice.","B":"Conviene sempre produrre e vendere un prodotto con margine di contribuzione semplice positivo.","C":"In condizioni di capacità produttiva non modificabile e abbondante, se il margine di contribuzione evoluto di un prodotto è positivo, conviene sicuramente produrre e vendere il prodotto."},"correct_answer":"B","type":"mcq"},{"id":408,"topic_id":18,"topic_name":"C6 - Decisioni di gestione corrente: decisioni di vendita","question":"Quale delle seguenti affermazioni è sicuramente vera? (convenienza con MdC evoluto positivo)","options":{"A":"Conviene sempre produrre e vendere un prodotto con margine di contribuzione evoluto positivo.","B":"Conviene sempre produrre e vendere un prodotto con margine di contribuzione evoluto positivo se tutti i suoi emplice negativo."},"correct_answer":"B","type":"mcq"},{"id":412,"topic_id":18,"topic_name":"C6 - Decisioni di gestione corrente: decisioni di vendita","question":"MdC semplice positivo e MdC evoluto negativo, capacità produttiva non modificabile e abbondante. Quale delle seguenti affermazioni è falsa?","options":{"A":"Conviene produrre e vendere il prodotto se i suoi costi fissi diretti totali sono solo discrezionali.","B":"Conviene produrre e vendere il prodotto se i suoi costi fissi diretti totali sono solo di capacità.","C":"Non è possibile decidere sulla base dei segni dei due margini di contribuzione se i costi fissi diretti totali del prodotto sono in parte discrezionali e in parte di capacità."},"correct_answer":"A","type":"mcq"},{"id":413,"topic_id":18,"topic_name":"C6 - Decisioni di gestione corrente: decisioni di vendita","question":"Se un'azienda con capacità produttiva non modificabile e abbondante smette di produrre e vendere un prodotto il cui margine di contribuzione evoluto complessivo è positivo, quale delle seguenti affermazioni non è sempre vera?","options":{"A":"La diminuzione del risultato economico d'esercizio è pari, in valore assoluto, al margine di contribuzione evoluto del prodotto.","B":"La diminuzione del risultato economico d'esercizio è pari, in valore assoluto, al margine di contribuzione evoluto del prodotto se i suoi costi fissi diretti totali sono solo discrezionali.","C":"La diminuzione del risultato economico d'esercizio è, in valore assoluto, maggiore o eguale al margine di contribuzione evoluto del prodotto."},"correct_answer":"A","type":"mcq"},{"id":414,"topic_id":18,"topic_name":"C6 - Decisioni di gestione corrente: decisioni di vendita","question":"Quale delle seguenti affermazioni è vera? (margine di contribuzione semplice per unità di fattore produttivo scarso)","options":{"A":"Se positivo, il margine di contribuzione semplice di un prodotto per unità di fattore produttivo scarso esprime il contributo che la vendita del pr function optText(w,key){if(key==null)return'—';if(key==='True')return'Vero';if(key==='False')return'Falso';const v=(w.options||{})[key];return v?key+') '+v:key}
function renderResults(){if(!Q){location.hash='#home';return}let h=`<div class="fadein"><div class="row"><button class="backbtn" onclick="location.hash='#home'">← Home</button></div><div class="row spread" style="margin:10px 0 14px"><h2>Risposte sbagliate</h2><span class="badge">${Q.correct} / ${Q.questions.length}</span></div>`;if(!Q.wrong.length)h+=`<div class="card center"><div style="font-size:46px">🎉</div><b>Nessun errore — punteggio perfetto!</b></div>`;for(const w of Q.wrong)h+=`<div class="card"><div style="font-weight:600;margin-bottom:12px;white-space:pre-wrap">${esc(w.question)}</div><div class="small"><span class="muted">La tua risposta: </span><span style="color:var(--red);font-weight:700">${esc(optText(w,w.user_answer))}</span></div><div class="small"><span class="muted">Corretta: </span><span style="color:var(--green);font-weight:700">${esc(optText(w,w.correct_answer))}</span></div></div>`;app.innerHTML=h+`<button class="btn ghost" onclick="location.hash='#home'">Torna alla Home</button></div>`}
function renderProgress(){const ps=completed();let tc=0,tt=0;ps.forEach(p=>{tc+=p.score;tt+=p.total});const overall=tt?Math.round(tc/tt*100):0;const miss={};ps.forEach(p=>{if(p.total){(miss[p.topic_name]=miss[p.topic_name]||{c:0,t:0}).c+=p.score;miss[p.topic_name].t+=p.total}});let worst='—',wp=101;for(const[k,v]of Object.entries(miss)){const p=v.c/v.t*100;if(p<wp){wp=p;worst=k}}let opts='<option value="">Tutti gli argomenti</option>';TOPICS.forEach(t=>opts+=`<option value="${esc(t.name)}">${esc(t.name)}</option>`);app.innerHTML=`<div class="fadein"><button class="backbtn" onclick="location.hash='#home'">← Home</button><h2 style="margin-top:10px">Progressi</h2><div class="row" style="margin-bottom:16px"><div class="stat"><div class="big">${ps.length}</div><div class="muted small">sessioni</div></div><div class="stat"><div class="big">${overall}%</div><div class="muted small">precisione totale</div></div><div class="stat"><div style="font-size:15px;font-weight:700">${esc(worst)}</div><div class="muted small">più sbagliato</div></div></div><div class="card"><div class="row spread" style="margin-bottom:12px"><strong>Punteggio per sessione</strong><select id="topicFilter">${opts}</select></div><div class="chartbox" id="chart"></div></div><div class="card tablewrap"><table><thead><tr><th>Data</th><th>Argomento</th><th>Mod.</th><th>Punti</th><th>%</th></tr></thead><tbody id="ptbody"></tbody></table></div><div class="row" style="margin-top:12px"><button class="btn secondary" onclick="exportData()">Esporta progressi</button><button class="btn ghost" onclick="importData()">Importa progressi</button><button class="btn ghost" onclick="resetData()">Azzera progressi</button></div></div>`;const draw=f=>{const rows=(f?ps.filter(p=>p.topic_name===f):ps).slice().reverse();drawChart(rows);const tr=f?ps.filter(p=>p.topic_name===f):ps;document.getElementById('ptbody').innerHTML=tr.length?tr.map(p=>`<tr><td>${fmtDate(p.started_at)}</td><td>${esc(p.topic_name)}</td><td>${MODE_IT[p.mode]||esc(p.mode)}</td><td>${p.score}/${p.total}</td><td>${Math.round(p.score/p.total*100)}%</td></tr>`).join(''):'<tr><td colspan="5" class="muted">Nessuna sessione completata.</td></tr>'};document.getElementById('topicFilter').onchange=e=>draw(e.target.value);draw('')}
function drawChart(rows){const el=document.getElementById('chart');if(!rows.length){el.innerHTML='<div class="muted center" style="padding-top:80px">Nessuna sessione completata.</div>';return}const W=760,H=230,ml=42,mr=10,mt=15,mb=32,iw=W-ml-mr,ih=H-mt-mb,pts=rows.map((r,i)=>[ml+(rows.length===1?iw/2:i*iw/(rows.length-1)),mt+ih-(r.score/r.total)*ih]),path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' '),dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="#7c5cff"><title>${rows[i].score}/${rows[i].total} — ${Math.round(rows[i].score/rows[i].total*100)}%</title></circle>`).join(''),grid=[0,25,50,75,100].map(v=>{const y=mt+ih-v/100*ih;return`<line x1="${ml}" y1="${y}" x2="${W-mr}" y2="${y}" stroke="#2a3046"/><text x="${ml-8}" y="${y+4}" text-anchor="end" fill="#98a1bd" font-size="11">${v}</text>`}).join('');el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${grid}<path d="${path}" fill="none" stroke="#5b95f9" stroke-width="3" stroke-linecap="round"/>${dots}</svg>`}
function renderWrong(){const rows=wrongRows(),topics=[...new Set(rows.map(r=>r.topic_name).filter(Boolean))];let opts='<option value="">Tutti gli argomenti</option>';topics.forEach(t=>opts+=`<option value="${esc(t)}">${esc(t)}</option>`);let h=`<div class="fadein"><button class="backbtn" onclick="location.hash='#home'">← Home</button><div class="row spread" style="margin:10px 0 14px"><h2>Domande sbagliate</h2><span class="badge">${rows.length}</span></div>`;if(!rows.length){app.innerHTML=h+`<div class="card center muted">Ancora nulla qui — completa un quiz e le domande sbagliate compariranno in questa raccolta.</div></div>`;return}h+=`<div class="row" style="margin-bottom:14px"><select id="wf" style="flex:1">${opts}</select><button class="btn" style="width:auto" onclick="quizWrong()">Allena su queste</button></div><div id="wlist"></div></div>`;app.innerHTML=h;function list(f){const rs=f?rows.filter(r=>r.topic_name===f):rows;document.getElementById('wlist').innerHTML=rs.map((r,i)=>`<div class="card"><div class="row spread small muted"><span>${esc(r.topic_name||'—')}</span><span class="pill bad">sbagliata ×${r.wrong_count}</span></div><div style="font-weight:600;margin:10px 0;white-space:pre-wrap">${esc(r.question)}</div><span class="reveal" onclick="document.getElementById('ans${i}').classList.toggle('hidden')">Mostra risposta ▾</span><div id="ans${i}" class="hidden small" style="margin-top:9px;color:var(--green);font-weight:700">${esc(optText(r,r.correct_answer))}</div></div>`).join('')}document.getElementById('wf').onchange=e=>list(e.target.value);list('')}
function quizWrong(){startQuiz('wrong',null,'Domande sbagliate')}function resetData(){if(confirm('Cancellare tutti i progressi e le risposte salvate su questo iPad?')){localStorage.removeItem(KEY);Q=null;location.hash='#home';location.reload()}}function exportData(){const blob=new Blob([JSON.stringify(store())],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='quizEconomia-progressi.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(){const i=document.createElement('input');i.type='file';i.accept='.json,application/json';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.sessions||!x.answers)throw Error();save(x);alert('Progressi importati.');location.reload()}catch(e){alert('File progressi non valido.')}};r.readAsText(f)};i.click()}
</script></body></html>
